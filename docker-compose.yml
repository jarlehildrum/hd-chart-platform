version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: hd-postgres
    restart: always
    environment:
      POSTGRES_DB: hdplatform
      POSTGRES_USER: hduser
      POSTGRES_PASSWORD: hdplatform123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - hd-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hduser -d hdplatform"]
      interval: 30s
      timeout: 10s
      retries: 3

  # HD Platform API Service
  hd-platform-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: hd-platform-api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - DATABASE_URL=Host=postgres;Port=5432;Database=hdplatform;Username=hduser;Password=hdplatform123
      - HD_ADMIN_SECRET=${HD_ADMIN_SECRET:-hd_admin_536290824388ea22}
      - HD_CHART_API_URL=http://100.101.12.75:5100
      - MOONSHOT_API_KEY=sk-fgDeesw0gKBCRsZ1D8R4owPdvbqun9rcr5v2QYd8xy9CLbHI
      - DataDirectory=/app/data
    volumes:
      - hd_data:/app/data
      - hd_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hd-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # HD Platform Web Service (same app, different port)
  hd-platform-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: hd-platform-web
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5001
      - DATABASE_URL=Host=postgres;Port=5432;Database=hdplatform;Username=hduser;Password=hdplatform123
      - HD_ADMIN_SECRET=${HD_ADMIN_SECRET:-hd_admin_536290824388ea22}
      - HD_CHART_API_URL=http://100.101.12.75:5100
      - MOONSHOT_API_KEY=sk-fgDeesw0gKBCRsZ1D8R4owPdvbqun9rcr5v2QYd8xy9CLbHI
      - DataDirectory=/app/data
    volumes:
      - hd_data:/app/data
      - hd_logs:/app/logs
    depends_on:
      - postgres
    networks:
      - hd-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5001/api"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana Analytics Dashboard - Direct Port Access
  hd-grafana:
    image: grafana/grafana:10.2.0
    container_name: hd-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=hdplatform123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_HTTP_PORT=3000
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=true
      - GF_PROVISIONING_PATH=/etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hd-network
    user: "0"

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: hd-redis
    restart: always
    command: redis-server --requirepass hdplatform123
    volumes:
      - redis_data:/data
    networks:
      - hd-network
    healthcheck:
      test: ["CMD", "redis-cli", "auth", "hdplatform123", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: hd-nginx
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - hd-platform-api
      - hd-platform-web
      - hd-grafana
    networks:
      - hd-network

volumes:
  postgres_data:
    driver: local
  grafana_data:
    driver: local
  redis_data:
    driver: local
  hd_data:
    driver: local
  hd_logs:
    driver: local

networks:
  hd-network:
    driver: bridge

# Access URLs:
# http://46.224.44.77/          → Landing page
# http://46.224.44.77/api/      → API endpoints  
# http://46.224.44.77/docs      → Swagger docs
# http://46.224.44.77/admin/    → Admin panel
# http://46.224.44.77/analytics/→ Grafana dashboards